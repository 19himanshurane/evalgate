name: Prompt Regression Eval

# Two triggers, two jobs, on purpose:
#  - pull_request: check a proposed prompt change and comment/gate on it.
#    Nothing is written back to the repo here -- PRs can be pushed to
#    repeatedly and re-run without polluting history.
#  - push to main: a PR that touched /prompts just got merged, so this
#    *is* the new baseline. Record it permanently in /runs (so the next
#    PR's comparison has something real to diff against) and notify Slack.
"on":
  pull_request:
    paths:
      - "prompts/**"
  push:
    branches: [main]
    paths:
      - "prompts/**"

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find changed prompt file
        id: changed
        run: |
          FILE=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD -- 'prompts/*.yaml' | tail -n 1)
          echo "prompt_file=$FILE" >> "$GITHUB_OUTPUT"
          if [ -z "$FILE" ]; then
            echo "No versioned prompt YAML changed -- nothing to evaluate."
          fi

      - name: Run eval on the proposed prompt
        if: steps.changed.outputs.prompt_file != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run_eval.py --prompt "${{ steps.changed.outputs.prompt_file }}"

      - name: Compare against the last recorded baseline
        if: steps.changed.outputs.prompt_file != ''
        id: compare
        continue-on-error: true # so we still comment/upload even on a critical result
        env:
          EVAL_WARNING_THRESHOLD: ${{ vars.EVAL_WARNING_THRESHOLD }}
          EVAL_CRITICAL_THRESHOLD: ${{ vars.EVAL_CRITICAL_THRESHOLD }}
        run: python compare_runs.py --markdown-out pr_comment.md

      - name: Generate HTML report
        if: steps.changed.outputs.prompt_file != ''
        run: python generate_report.py

      - name: Post or update PR comment
        if: steps.changed.outputs.prompt_file != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- evalgate-comment -->';
            const body = marker + '\n' + fs.readFileSync('pr_comment.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload run + report as build artifacts
        if: steps.changed.outputs.prompt_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-${{ github.event.pull_request.number }}
          path: |
            runs/
            reports/

      - name: Fail the check on a critical regression
        if: steps.changed.outputs.prompt_file != '' && steps.compare.outcome == 'failure'
        run: |
          echo "Critical regression detected -- see the PR comment for details."
          exit 1

  record-baseline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find merged prompt file
        id: changed
        run: |
          FILE=$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" -- 'prompts/*.yaml' | tail -n 1)
          echo "prompt_file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Run eval on the newly merged prompt
        if: steps.changed.outputs.prompt_file != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run_eval.py --prompt "${{ steps.changed.outputs.prompt_file }}"

      - name: Compare against the previous baseline
        if: steps.changed.outputs.prompt_file != ''
        id: compare
        continue-on-error: true
        run: python compare_runs.py

      - name: Send Slack alert
        if: steps.changed.outputs.prompt_file != '' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python send_alert.py

      - name: Commit the new baseline run
        if: steps.changed.outputs.prompt_file != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runs/*.json
          git diff --staged --quiet && echo "Nothing new to commit" || git commit -m "Record eval run for merged prompt change [skip ci]"
          git push
