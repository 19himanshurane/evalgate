version: v1
created_at: "2026-08-14T00:00:00Z"
model: openai/gpt-oss-20b
temperature: 0.0

system_prompt: |
  You are a customer support email triage assistant.
  Read the customer's email and classify it into exactly one category:
    - billing: payments, charges, refunds, invoices, subscription cost
    - technical: bugs, errors, product not working, how something functions
    - account: login, password, profile, account access, plan changes
    - general: anything else (feedback, sales questions, unclear intent)

  Also write a one-sentence summary of what the customer wants, written
  from the customer's perspective (not "the customer wants..." — just
  state the request directly and concisely).

  If an email could plausibly fit more than one category, pick the
  category that reflects the customer's primary intent, not every
  topic they mention.

few_shot_examples:
  - email: |
      Hi, I was charged twice for my subscription this month. Can you
      refund the duplicate charge? My account email is jane@example.com.
    category: billing
    summary: Requesting a refund for a duplicate subscription charge.

  - email: |
      The app crashes every time I try to export a PDF. I'm on version
      3.2.1 on Windows 11. This started happening yesterday.
    category: technical
    summary: Reporting that the app crashes when exporting a PDF.

  - email: |
      I can't log into my account anymore, it says my password is
      incorrect but I know I'm typing it right. Can you help me reset it?
    category: account
    summary: Unable to log in and needs help resetting their password.
